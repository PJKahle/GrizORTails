<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Griz or Tails</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;700&display=swap');

  :root {
    --gold: #d4af37;
    --gold-light: #f5e07a;
    --gold-dark: #9a7d1a;
    --bg: #0a0a0a;
    --surface: #141414;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    overflow: hidden;
  }

  /* Radial glow BG */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #2a1f00 0%, #0a0a0a 70%);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }

  h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(3rem, 10vw, 5.5rem);
    letter-spacing: 0.12em;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(212,175,55,0.4));
  }

  /* COIN */
  .coin-scene {
    perspective: 800px;
    width: 260px;
    height: 260px;
  }

  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
    cursor: pointer;
    border-radius: 50%;
  }

  .coin.flipping {
    animation: coinFlip 1.4s ease-in-out forwards;
  }

  @keyframes coinFlip {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(var(--flip-end)); }
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    border: 5px solid var(--gold);
    box-shadow:
      0 0 0 2px var(--gold-dark),
      0 0 30px rgba(212,175,55,0.5),
      0 8px 40px rgba(0,0,0,0.8);
  }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .face-tails {
    transform: rotateY(180deg);
    background: radial-gradient(circle at 30% 30%, #e8c84a, #b8960c 40%, #7a5f00);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Tails side coin design */
  .tails-design {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .tails-ring {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.2);
  }

  .tails-ring::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.15);
  }

  .tails-text-top {
    position: absolute;
    top: 28px;
    font-family: 'Bebas Neue', cursive;
    font-size: 0.95rem;
    letter-spacing: 0.25em;
    color: rgba(0,0,0,0.55);
  }

  .tails-big {
    font-family: 'Bebas Neue', cursive;
    font-size: 3rem;
    color: rgba(0,0,0,0.6);
    letter-spacing: 0.1em;
  }

  .tails-stars {
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: rgba(0,0,0,0.4);
    margin-top: -8px;
  }

  /* RESULT */
  .result-label {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(2.5rem, 8vw, 4rem);
    letter-spacing: 0.15em;
    min-height: 1.2em;
    text-align: center;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.5s, transform 0.5s;
    filter: drop-shadow(0 0 16px currentColor);
  }

  .result-label.show {
    opacity: 1;
    transform: translateY(0);
  }

  .result-label.griz-result {
    background: linear-gradient(135deg, #fff 30%, #ccc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-label.tails-result {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* BUTTON */
  .flip-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #000;
    border: none;
    padding: 16px 52px;
    font-family: 'Bebas Neue', cursive;
    font-size: 1.8rem;
    letter-spacing: 0.2em;
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(212,175,55,0.4), 0 2px 8px rgba(0,0,0,0.5);
  }

  .flip-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .flip-btn:hover::after { opacity: 1; }
  .flip-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(212,175,55,0.5); }
  .flip-btn:active { transform: translateY(0); }
  .flip-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* SCORE */
  .score-row {
    display: flex;
    gap: 40px;
    align-items: center;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .score-label {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  .score-num {
    font-family: 'Bebas Neue', cursive;
    font-size: 2.2rem;
    line-height: 1;
  }

  .score-num.griz-score { color: rgba(255,255,255,0.85); }
  .score-num.tails-score { color: var(--gold); }

  .score-divider {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,0.15);
  }

  /* shimmer on coin edge */
  .face::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%, rgba(0,0,0,0.1) 100%);
    pointer-events: none;
  }

  /* Instagram tab */
  .insta-tab {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%) rotate(0deg);
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    color: #fff;
    font-family: 'Bebas Neue', cursive;
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    padding: 12px 10px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    text-decoration: none;
    border-radius: 8px 0 0 8px;
    box-shadow: -3px 0 16px rgba(0,0,0,0.4);
    z-index: 100;
    transition: padding 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .insta-tab:hover {
    padding-right: 16px;
    box-shadow: -6px 0 24px rgba(220,39,67,0.5);
  }

  .insta-tab svg {
    width: 18px;
    height: 18px;
    fill: white;
    flex-shrink: 0;
  }

  /* Facebook share button */
  .share-btn {
    background: #1877f2;
    color: #fff;
    border: none;
    padding: 13px 32px;
    font-family: 'Bebas Neue', cursive;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(24,119,242,0.35);
  }

  .share-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(24,119,242,0.5);
  }

  .share-btn svg {
    width: 20px;
    height: 20px;
    fill: white;
  }

  .action-row {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
</style>
</head>

  // --- Coin sound via Web Audio API ---
  function playCoinSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const duration = 1.4;

      // Multiple tings at increasing speed to simulate spinning
      const times = [0, 0.18, 0.33, 0.46, 0.57, 0.66, 0.74, 0.81, 0.87, 0.92, 0.96, 0.99, 1.01, 1.03, 1.05, 1.1, 1.2];
      times.forEach((t, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        // Slightly different pitch each ting for realism
        osc.frequency.value = 1800 + Math.random() * 400;
        osc.type = 'sine';
        const vol = i < times.length - 3 ? 0.18 : 0.08; // quieter at end
        gain.gain.setValueAtTime(0, ctx.currentTime + t);
        gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + t + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.18);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.2);
      });
    } catch(e) {}
  }

  // --- Facebook Share ---
  function shareToFacebook() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent('Play Griz or Tails — flip a coin with @GrizComedy! 🪙');
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${text}`, '_blank', 'width=600,height=400');
  }

  function flipCoin() {
    if (isFlipping) return;
    isFlipping = true;

    const btn = document.getElementById('flipBtn');
    const coin = document.getElementById('coin');
    const label = document.getElementById('resultLabel');

    btn.disabled = true;
    label.classList.remove('show');
    playCoinSound();

    const result = Math.random() < 0.5 ? 'griz' : 'tails';

    // Determine spin amount: always at least 3 full rotations + land on correct face
    // Griz = 0deg (front), Tails = 180deg
    // We accumulate from current visual rotation
    const baseSpins = (3 + Math.floor(Math.random() * 3)) * 360;
    const landAngle = result === 'tails' ? 180 : 0;
    // We need the final angle mod 360 to equal landAngle
    // Simple approach: just set a big number and use a CSS variable trick
    // We'll track total degrees turned
    
    // Always end on a known face: add extra half if needed
    let endDeg = baseSpins + landAngle;
    
    coin.style.setProperty('--flip-end', endDeg + 'deg');
    coin.style.transform = `rotateY(${endDeg}deg)`;
    coin.classList.remove('flipping');
    void coin.offsetWidth; // reflow
    coin.classList.add('flipping');

    setTimeout(() => {
      // Set final static transform
      coin.classList.remove('flipping');
      coin.style.transform = `rotateY(${landAngle}deg)`;

      if (result === 'griz') {
        grizCount++;
        document.getElementById('grizScore').textContent = grizCount;
        label.textContent = 'GRIZ!';
        label.className = 'result-label griz-result show';
      } else {
        tailsCount++;
        document.getElementById('tailsScore').textContent = tailsCount;
        label.textContent = 'TAILS!';
        label.className = 'result-label tails-result show';
      }

      btn.disabled = false;
      isFlipping = false;
    }, 1450);
  }
</script>
</body>
</html>
